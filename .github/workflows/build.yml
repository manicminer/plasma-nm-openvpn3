#
# The build, test and package path. Called by ci.yml on every push and by
# release.yml on a tag, so that what a release is built by is what every
# ordinary run has already exercised -- a release workflow nobody runs until
# the day of the release is a workflow nobody has tested.
name: Build

on:
  workflow_call:
    inputs:
      backend-repository:
        description: >-
          Checkout of the NetworkManager OpenVPN 3 backend, whose libnm plugin
          the importer tests use. Without it those tests skip, which the
          summary says.
        type: string
        default: ''
      backend-ref:
        type: string
        default: ''
      artifact-retention-days:
        type: number
        default: 14

permissions:
  contents: read

jobs:
  build:
    name: Build and test against a stock plasma-nm
    runs-on: ubuntu-latest
    steps:
      # The runner's own scratch directory, which is outside the checkout --
      # what testing/paths.sh insists on -- and, unlike a sibling of the
      # workspace, is reached without a "..". run.sh canonicalises whatever it
      # is given, but actions/upload-artifact judges the string it is handed
      # and rejects one containing "/../" however it resolves: that is what
      # failed run 37331953615, after the build, the tests, the packaging and
      # the install-check had all passed.
      #
      # In a step, not in the job's env: runner.temp is not available there,
      # and RUNNER_TEMP is only set once a job is running on a machine.
      # testing/test-workflows.sh keeps this path canonical and accepted.
      - name: Choose the scratch directory
        run: |
          set -eu
          echo "BUILD_ROOT=$RUNNER_TEMP/openvpn3-build" >> "$GITHUB_ENV"

      - name: Check out the module
        uses: actions/checkout@v4
        with:
          # describe() names the artifacts, so the tags have to be here.
          fetch-depth: 0

      # No continue-on-error: a backend that was asked for and did not arrive
      # is a failed run, not a quieter one. Letting this step fail softly meant
      # a bad repository name or ref turned the importer tests into skips --
      # and a release would have been published off a run that never exercised
      # the real importer, saying so only in a job summary nobody reads.
      - name: Check out the OpenVPN 3 backend
        if: inputs.backend-repository != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.backend-repository }}
          ref: ${{ inputs.backend-ref }}
          path: backend

      - name: Report whether the importer tests will run for real
        env:
          BACKEND_REPOSITORY: ${{ inputs.backend-repository }}
        run: |
          set -eu
          if [ -f backend/meson.build ]; then
            echo "BACKEND_ROOT=$GITHUB_WORKSPACE/backend" >> "$GITHUB_ENV"
            echo "The OpenVPN 3 backend is present: the importer tests run against the real libnm importer." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$BACKEND_REPOSITORY" ]; then
            # Checked out, so the ref exists, but it has no meson.build: this
            # is not the backend, and the importer tests would have skipped.
            echo "::error::$BACKEND_REPOSITORY was checked out but has no meson.build, so it is not the OpenVPN 3 backend; refusing to skip the importer tests silently."
            exit 1
          else
            echo "The OpenVPN 3 backend is **not** present: the importer tests will skip." >> "$GITHUB_STEP_SUMMARY"
            echo "A run with no skips is the evidence that the real importer was exercised; this run is not one." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the container images
        run: testing/run.sh images

      - name: Fetch and verify the pinned plasma-nm source
        run: testing/run.sh source

      - name: Build
        run: testing/run.sh build

      - name: Test
        run: testing/run.sh test

      - name: Package
        run: testing/run.sh package

      - name: Verify what the artifact installs
        run: testing/run.sh install-check

      - name: Record what this was built against
        run: |
          {
            echo '## Artifacts'
            echo
            echo '```'
            cat "$BUILD_ROOT/package/SHA256SUMS"
            echo '```'
            echo
            echo '## Provenance'
            echo
            echo '```'
            tar -xzOf "$BUILD_ROOT"/package/plasma-nm-openvpn3-*-*-*-plasma-nm-*.tar.gz \
                --wildcards '*/PROVENANCE.txt' | sed -n '1,12p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plasma-nm-openvpn3-artifacts
          path: ${{ env.BUILD_ROOT }}/package/
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error
